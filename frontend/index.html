<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Junior AI Investigator — Case Queue</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,500;8..60,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/styles.css">
</head>
<body>

<header class="topbar">
  <div class="topbar-title">
    <span class="topbar-mark">JAI</span>
    <h1>Junior AI Investigator</h1>
  </div>
  <div id="brief" class="brief">Loading queue…</div>
</header>

<main class="layout">
  <section class="queue-pane">
    <div class="queue-controls">
      <input id="search" type="text" placeholder="Search case, claim #, state…" />
      <div class="filter-chips" id="filterChips">
        <button class="chip active" data-level="all">All</button>
        <button class="chip risk-high" data-level="high">High</button>
        <button class="chip risk-medium" data-level="medium">Medium</button>
        <button class="chip risk-low" data-level="low">Low</button>
      </div>
    </div>
    <div id="queueList" class="queue-list"></div>
  </section>

  <section class="detail-pane" id="detailPane">
    <div class="empty-state">
      <p>Select a case from the queue to see the AI's assessment.</p>
    </div>
  </section>
</main>

<script src="/app.js"></script>
</body>
</html>
